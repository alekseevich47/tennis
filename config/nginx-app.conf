# app.milenkih-team.ru — Mini App + PocketBase
# Корень milenkih-team.ru свободен под лендинг (отдельный server).

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream pocketbase {
    server 127.0.0.1:8090;
    keepalive 32;
}

server {
    server_name app.milenkih-team.ru;
    listen 443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/app.milenkih-team.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.milenkih-team.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/tennis/client/dist;
    index index.html;

    # Не ставить X-Frame-Options SAMEORIGIN: desktop MAX (web.max.ru) грузит mini-app в iframe.
    # Mobile WebView открывает URL напрямую — поэтому «на телефоне ок, на ПК Техническая заминка».
    # frame-ancestors — отдельно (совместимость с iframe MAX). Остальной CSP — без inline-unsafe где возможно;
    # 'unsafe-inline' в script-src нужен Vite/React runtime и MAX bridge; script host — self + st.max.ru.
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.max.ru https://max.ru https://*.max.ru; default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://st.max.ru; connect-src 'self' https: wss:; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: только на HTTPS server (этот блок). preload не включаем без явного решения.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;

    location ^~ /api/files/ {
        proxy_pass http://pocketbase/api/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ^~ /api/realtime {
        proxy_pass http://pocketbase/api/realtime;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://pocketbase;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
    }

    location /_/ {
        auth_basic "PocketBase Admin";
        auth_basic_user_file /etc/nginx/.htpasswd_pb_admin;

        limit_req zone=api burst=20 nodelay;
        proxy_pass http://pocketbase;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }
}

server {
    listen 80;
    server_name app.milenkih-team.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Корень домена — заглушка под будущий сайт
server {
    listen 80;
    server_name milenkih-team.ru www.milenkih-team.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        return 200 "milenkih-team.ru\n";
    }
}
