<svg xmlns="http://w3.org" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      /* 
        Полный цикл полета мяча (1.8 секунды):
        0%   - Синяя ракетка бьет по мячу (вдали, масштаб 0.75)
        22%  - Мяч ударяется о ближнюю (зеленую) половину стола (масштаб 1.1)
        45%  - Красная ракетка отбивает мяч (вблизи, масштаб 1.4)
        50%  - Момент фиксации удара красной ракетки
        72%  - Мяч ударяется о дальнюю половину стола (вдали, масштаб 0.9)
        100% - Возврат к синей ракетке
      */
      @keyframes ball-ping-pong {
        0% {
          transform: translate(185px, 120px) scale(0.75, 0.75);
        }
        22% {
          transform: translate(190px, 225px) scale(1.2, 0.8); /* Отскок от стола ближнего (сплющивание) */
        }
        25% {
          transform: translate(190px, 220px) scale(1.1, 1.1);
        }
        45% {
          transform: translate(192px, 250px) scale(1.3, 1.3);
        }
        50% {
          transform: translate(192px, 255px) scale(1.5, 0.9); /* Удар красной ракетки */
        }
        55% {
          transform: translate(192px, 250px) scale(1.3, 1.3);
        }
        72% {
          transform: translate(187px, 175px) scale(0.9, 0.7); /* Отскок от стола дальнего */
        }
        75% {
          transform: translate(187px, 172px) scale(0.85, 0.85);
        }
        95% {
          transform: translate(185px, 120px) scale(0.8, 0.8);
        }
        100% {
          transform: translate(185px, 115px) scale(0.9, 0.6); /* Удар синей ракетки */
        }
      }

      /* Анимация дальней (синей) ракетки: срабатывает строго на 0% (100%) */
      @keyframes blue-hit {
        0%, 100% { transform: translateY(10px) rotate(-6deg); } /* Момент удара */
        15% { transform: translateY(-3px) rotate(2deg); }       /* Возврат */
        50% { transform: translateY(0px) rotate(0deg); }         /* Ожидание */
      }

      /* Анимация ближней (красной) ракетки: замах и удар строго на 50% */
      @keyframes red-hit {
        0%, 100% { transform: translateY(0px) rotate(0deg); }    /* Ожидание */
        40% { transform: translateY(4px) rotate(2deg); }         /* Замах */
        50% { transform: translateY(-12px) rotate(-8deg); }      /* Момент удара */
        65% { transform: translateY(2px) rotate(0deg); }         /* Возврат */
      }

      .ball {
        transform-origin: 0px 0px;
        animation: ball-ping-pong 1.8s infinite linear;
      }

      .racket-top {
        transform-origin: 200px 100px;
        animation: blue-hit 1.8s infinite ease-in-out;
      }

      .racket-bottom {
        transform-origin: 215px 265px;
        animation: red-hit 1.8s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Фон сцены -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- СТОЛ ДЛЯ НАСТОЛЬНОГО ТЕННИСА -->
  <g stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Задние ножки -->
    <rect x="150" y="240" width="14" height="40" fill="#4a2312" />
    <rect x="236" y="240" width="14" height="40" fill="#4a2312" />
    
    <!-- Передние ножки -->
    <rect x="114" y="244" width="16" height="75" fill="#7a3d21" />
    <rect x="270" y="244" width="16" height="75" fill="#7a3d21" />

    <!-- Игровая поверхность -->
    <polygon points="140,165 260,165 305,245 95,245" fill="#71c353" />

    <!-- Сетка -->
    <polygon points="100,185 300,185 300,210 100,210" fill="#e2e4f6" />
  </g>

  <!-- ДАЛЬНЯЯ РАКЕТКА (Синяя) -->
  <g class="racket-top" stroke="#000000" stroke-width="5" stroke-linejoin="round">
    <rect x="192" y="115" width="16" height="40" rx="4" fill="#fdd3a1" transform="rotate(-45 200 100)" />
    <line x1="200" y1="117" x2="228" y2="145" fill="none" stroke="#d2a679" stroke-width="2" />
    <circle cx="200" cy="100" r="24" fill="#6ba4ff" />
  </g>

  <!-- МЯЧ (Движется по параболам с отскоками) -->
  <g class="ball">
    <circle cx="0" cy="0" r="9" fill="#fff799" stroke="#000000" stroke-width="4" />
  </g>

  <!-- БЛИЖНЯЯ РАКЕТКА (Красная) -->
  <g class="racket-bottom" stroke="#000000" stroke-width="5" stroke-linejoin="round">
    <rect x="207" y="280" width="16" height="40" rx="4" fill="#fdd3a1" transform="rotate(45 215 265)" />
    <line x1="204" y1="276" x2="176" y2="304" fill="none" stroke="#d2a679" stroke-width="2" />
    <circle cx="215" cy="265" r="24" fill="#ff7657" />
  </g>
</svg>
